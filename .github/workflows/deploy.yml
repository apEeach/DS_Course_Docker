name: Build and Deploy with Compose

on:
  push:
    branches: [ main ] # 监听 main 分支

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/sxd_server/test_server:latest
            ${{ secrets.ALIYUN_REGISTRY }}/sxd_server/test_server:${{ github.sha }}

  deploy-to-server:
    name: Deploy to Server
    needs: build-and-push # 等上面的构建完成后才执行
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 进入服务器上的项目目录
            cd /opt/myapp
            
            # 2. 登录阿里云镜像仓库 (为了拉取私有镜像)
            docker login --username=${{ secrets.ALIYUN_USERNAME }} --password=${{ secrets.ALIYUN_PASSWORD }} ${{ secrets.ALIYUN_REGISTRY }}
            
            # 3. 拉取最新镜像
            docker compose pull
            
            # 4. 重启服务 (docker compose up -d 会自动检测镜像变化并重建容器)
            docker compose up -d
            
            # 5. 清理旧镜像 (可选，节省空间)
            docker image prune -f