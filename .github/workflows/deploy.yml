name: Build and Deploy with Compose

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push App Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Load GIT_REPO_URL from .env
        run: |
          source .env
          echo "REPO_URL=${GIT_REPO_URL}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          ssh: default
          build-args: |
            GIT_REPO_URL=${{ env.REPO_URL }}
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/sxd_server/test_server:latest
            ${{ secrets.ALIYUN_REGISTRY }}/sxd_server/test_server:${{ github.sha }}

  deploy-to-server:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare compose files
        run: |
          mkdir -p deploy
          source .env
          export APP_IMAGE="${{ secrets.ALIYUN_REGISTRY }}/sxd_server/test_server:${{ github.sha }}"
          export SERVER_NAME="${SERVER_NAME:-_}"
          envsubst '${APP_IMAGE}' < docker-compose.yml > deploy/docker-compose.yml
          envsubst '${SERVER_NAME}' < nginx.conf > deploy/nginx.conf
          cp -r migrations deploy/migrations

      - name: Upload .env to temp dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: /opt/myapp_tmp
          strip_components: 0

      - name: Upload compose + migrations files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/nginx.conf,deploy/migrations"
          target: /opt/myapp
          strip_components: 1

      - name: Flyway Migrate via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/myapp

            # 如果迁移目录不存在则跳过（本地开发模式走 Docker MySQL）
            if [ ! -d "migrations" ]; then
              echo "No migrations directory, skipping Flyway."
            else
              # 登录阿里云镜像仓库
              docker login --username=${{ secrets.ALIYUN_USERNAME }} --password=${{ secrets.ALIYUN_PASSWORD }} ${{ secrets.ALIYUN_REGISTRY }}

              # 从 .env 读取数据库连接信息
              set -a
              source .env
              set +a

              echo "Running Flyway migration against ${DB_HOST}:${DB_PORT:-3306}/${DB_NAME} ..."

              # 拉取 Flyway 镜像（本地可能不存在）
              docker pull flyway/flyway:latest

              # 运行 Flyway Docker 执行迁移（一次性容器，完成后自动退出）
              docker run --rm \
                --network host \
                -v "$(pwd)/migrations:/flyway/sql" \
                flyway/flyway:latest \
                -url="jdbc:mysql://${DB_HOST}:${DB_PORT:-3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai" \
                -user="${DB_USER}" \
                -password="${DB_PASS}" \
                -locations="filesystem:/flyway/sql" \
                migrate

              echo "Flyway migration completed."
            fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/myapp
            # 首次部署才使用仓库的 .env，后续不覆盖服务器已有配置
            if [ ! -f .env ] && [ -f /opt/myapp_tmp/.env ]; then
              mv /opt/myapp_tmp/.env .env
            else
              rm -f /opt/myapp_tmp/.env
            fi
            # 清理可能占用端口的旧 nginx 进程
            nginx -s stop 2>/dev/null || true
            systemctl stop nginx 2>/dev/null || true
            # 登录阿里云镜像仓库
            docker login --username=${{ secrets.ALIYUN_USERNAME }} --password=${{ secrets.ALIYUN_PASSWORD }} ${{ secrets.ALIYUN_REGISTRY }}
            # 拉取最新镜像
            docker compose pull
            # 重启容器
            docker compose down
            docker compose up -d
            # 清理旧镜像
            docker image prune -f
