name: Build and Deploy with Compose

on:
  push:
    branches: [ main ]

env:
  ACR_NAMESPACE: sxd_server
  DEPLOY_TARGET: 1  # 1=只部署第一套, 2=只部署第二套, both=都部署
  SECONDARY_ACR_REGISTRY: ${{ secrets.ALIYUN_REGISTRY_2 }}
  SECONDARY_SSH_HOST: ${{ secrets.SSH_HOST_2 }}

jobs:
  build-and-push:
    name: Build & Push App Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set date-based image tag
        id: set-tag
        run: echo "IMAGE_TAG=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Login to Primary ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Login to Secondary ACR (if configured)
        if: ${{ env.SECONDARY_ACR_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_2 }}
          username: ${{ secrets.ALIYUN_USERNAME_2 }}
          password: ${{ secrets.ALIYUN_PASSWORD_2 }}

      - name: Load GIT_REPO_URL from .env
        run: |
          source .env
          echo "REPO_URL=${GIT_REPO_URL}" >> $GITHUB_ENV
          echo "PAY_REPO_URL=${PAY_GIT_REPO_URL}" >> $GITHUB_ENV

      - name: Build and Push Pay Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pay
          push: true
          ssh: default
          no-cache: true
          build-args: |
            PAY_GIT_REPO_URL=${{ env.PAY_REPO_URL }}
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/test_pay:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/test_pay:${{ steps.set-tag.outputs.IMAGE_TAG }}

      - name: Build and Push Pay Image (Secondary)
        if: ${{ env.SECONDARY_ACR_REGISTRY != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pay
          push: true
          ssh: default
          no-cache: true
          build-args: |
            PAY_GIT_REPO_URL=${{ env.PAY_REPO_URL }}
          tags: |
            ${{ secrets.ALIYUN_REGISTRY_2 }}/${{ env.ACR_NAMESPACE }}/test_pay:latest
            ${{ secrets.ALIYUN_REGISTRY_2 }}/${{ env.ACR_NAMESPACE }}/test_pay:${{ steps.set-tag.outputs.IMAGE_TAG }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          ssh: default
          no-cache: true
          build-args: |
            GIT_REPO_URL=${{ env.REPO_URL }}
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/test_server:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/test_server:${{ steps.set-tag.outputs.IMAGE_TAG }}

      - name: Build and Push (Secondary)
        if: ${{ env.SECONDARY_ACR_REGISTRY != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          ssh: default
          no-cache: true
          build-args: |
            GIT_REPO_URL=${{ env.REPO_URL }}
          tags: |
            ${{ secrets.ALIYUN_REGISTRY_2 }}/${{ env.ACR_NAMESPACE }}/test_server:latest
            ${{ secrets.ALIYUN_REGISTRY_2 }}/${{ env.ACR_NAMESPACE }}/test_server:${{ steps.set-tag.outputs.IMAGE_TAG }}


  deploy-to-server-1:
    name: Deploy to Server 1
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy target
        if: ${{ env.DEPLOY_TARGET != '1' && env.DEPLOY_TARGET != 'both' }}
        run: exit 1

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare compose files
        run: |
          mkdir -p deploy
          source .env
          export APP_IMAGE="${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/test_server:${{ needs.build-and-push.outputs.image_tag }}"
          export PAY_IMAGE="${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/test_pay:${{ needs.build-and-push.outputs.image_tag }}"
          export SERVER_NAME="${SERVER_NAME:-_}"
          envsubst '${APP_IMAGE} ${PAY_IMAGE}' < docker-compose.yml > deploy/docker-compose.yml
          envsubst '${SERVER_NAME}' < nginx.conf > deploy/nginx.conf

      - name: Upload .env to temp dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".env"
          target: /opt/myapp_tmp
          strip_components: 0

      - name: Upload nginx.conf to temp dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/nginx.conf"
          target: /opt/myapp_tmp
          strip_components: 1

      - name: Upload compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml"
          target: /opt/myapp
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/myapp
            # 首次部署才使用仓库的 .env，后续不覆盖服务器已有配置
            if [ ! -f .env ] && [ -f /opt/myapp_tmp/.env ]; then
              mv /opt/myapp_tmp/.env .env
            else
              rm -f /opt/myapp_tmp/.env
            fi
            # 首次部署才使用仓库的 nginx.conf，后续不覆盖服务器已有配置
            if [ ! -f nginx.conf ] && [ -f /opt/myapp_tmp/nginx.conf ]; then
              mv /opt/myapp_tmp/nginx.conf .
            else
              rm -f /opt/myapp_tmp/nginx.conf
            fi
            # 清理可能占用端口的旧 nginx 进程
            nginx -s stop 2>/dev/null || true
            systemctl stop nginx 2>/dev/null || true
            # 登录阿里云镜像仓库
            docker login --username=${{ secrets.ALIYUN_USERNAME }} --password=${{ secrets.ALIYUN_PASSWORD }} ${{ secrets.ALIYUN_REGISTRY }}
            # 停容器 + 删除命名卷
            docker compose down --volumes
            # 拉取最新镜像（跳过 profiles 服务）
            docker compose pull app nginx pay
            # 启动容器
            docker compose up -d app nginx pay
            # 清理旧镜像释放空间
            docker image prune -af


  deploy-to-server-2:
    name: Deploy to Server 2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy target
        if: ${{ env.DEPLOY_TARGET != '2' && env.DEPLOY_TARGET != 'both' }}
        run: exit 1

      - name: Check Server 2 credentials
        if: ${{ env.SECONDARY_SSH_HOST == '' }}
        run: exit 1

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare compose files
        run: |
          mkdir -p deploy
          source .env
          export APP_IMAGE="${{ secrets.ALIYUN_REGISTRY_2 }}/${{ env.ACR_NAMESPACE }}/test_server:${{ needs.build-and-push.outputs.image_tag }}"
          export PAY_IMAGE="${{ secrets.ALIYUN_REGISTRY_2 }}/${{ env.ACR_NAMESPACE }}/test_pay:${{ needs.build-and-push.outputs.image_tag }}"
          export SERVER_NAME="${SERVER_NAME:-_}"
          envsubst '${APP_IMAGE} ${PAY_IMAGE}' < docker-compose.yml > deploy/docker-compose.yml
          envsubst '${SERVER_NAME}' < nginx.conf > deploy/nginx.conf

      - name: Upload .env to temp dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_2 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
          source: ".env"
          target: /opt/myapp_tmp
          strip_components: 0

      - name: Upload nginx.conf to temp dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_2 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
          source: "deploy/nginx.conf"
          target: /opt/myapp_tmp
          strip_components: 0

      - name: Upload compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_2 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
          source: "deploy/docker-compose.yml"
          target: /opt/myapp
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_2 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
          script: |
            cd /opt/myapp
            # 首次部署才使用仓库的 .env，后续不覆盖服务器已有配置
            if [ ! -f .env ] && [ -f /opt/myapp_tmp/.env ]; then
              mv /opt/myapp_tmp/.env .env
            else
              rm -f /opt/myapp_tmp/.env
            fi
            # 首次部署才使用仓库的 nginx.conf，后续不覆盖服务器已有配置
            if [ ! -f nginx.conf ] && [ -f /opt/myapp_tmp/nginx.conf ]; then
              mv /opt/myapp_tmp/nginx.conf .
            else
              rm -f /opt/myapp_tmp/nginx.conf
            fi
            # 清理可能占用端口的旧 nginx 进程
            nginx -s stop 2>/dev/null || true
            systemctl stop nginx 2>/dev/null || true
            # 登录阿里云镜像仓库
            docker login --username=${{ secrets.ALIYUN_USERNAME_2 }} --password=${{ secrets.ALIYUN_PASSWORD_2 }} ${{ secrets.ALIYUN_REGISTRY_2 }}
            # 停容器 + 删除命名卷
            docker compose down --volumes
            # 拉取最新镜像（跳过 profiles 服务）
            docker compose pull app nginx pay
            # 启动容器
            docker compose up -d app nginx pay
            # 清理旧镜像释放空间
            docker image prune -af
