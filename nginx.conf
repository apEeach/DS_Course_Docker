user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

# 错误日志
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP配置块
http {
    # MIME类型定义
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 定义上游服务器（Crow应用）
    upstream crow_backend {
        server app:8080;  # 使用容器名称和端口
    }

    # 定义上游服务器（Go支付服务）
    upstream go_pay {
        server my_go_pay:9090;
    }

    server {
        listen 80;
        server_name ${SERVER_NAME};

        # 1. 静态文件配置
        location / {
            # 指向你刚才创建的 html 目录
            root /usr/share/nginx/web/html;
            index index.html;
        }

        # 2. 反向代理配置 (转发给 Crow)
        location /api {
            proxy_pass http://crow_backend;

            # --- 重点：确保这些头被正确传递 ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # --- 关键：确保 Content-Length 被传递，否则 Crow 读不到 Body ---
            proxy_set_header Content-Length $content_length;
        }

        # 微信支付回调入口 → Go 支付服务
        location /pay/notify {
            proxy_pass http://go_pay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length $content_length;

            client_max_body_size 1m;
        }

        # Mock 查单接口（本地开发用，正式上线可移除）
        location /pay/mockOrderQuery/ {
            proxy_pass http://go_pay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
