user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

# 错误日志
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP配置块
http {
    # MIME类型定义
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 定义上游服务器（Crow应用）
    upstream crow_backend {
        server app:8080;  # 使用容器名称和端口
    }

    # 定义上游服务器（Go支付服务）
    upstream go_pay {
        server my_go_pay:9090;
    }

    # HTTP 服务（默认，部分接口需重定向到下方 HTTPS server）
    server {
        listen 80;
        server_name ${SERVER_NAME};

        # 1. 静态文件配置
        location / {
            root /usr/share/nginx/web/html;
            index index.html;
        }

        # 2. 反向代理配置 (转发给 Crow)
        location /api {
            proxy_pass http://crow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length $content_length;
        }

        # Mock 查单接口（本地开发用，正式上线可移除）
        location /pay/mockOrderQuery/ {
            proxy_pass http://go_pay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # HTTPS 服务（取消注释后启用，需确保 /opt/myapp/certs/ 下有 server.crt 和 server.key）
