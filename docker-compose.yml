version: '3.8'

services:
  # 1. 数据库服务（通过 ENABLE_MYSQL 控制，默认启用）
  db:
    image: swr.cn-north-4.myhuaweicloud.com/library/mysql:8.0
    container_name: my_mysql
    profiles:
      - mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}           # 数据库密码
      MYSQL_DATABASE: mydb                # 自动创建一个库
      # MYSQL_USER: user_ds                 # admin用户
      # MYSQL_PASSWORD: ds@888              # 用户密码
    ports:
      - "3306:3306" # 映射端口，方便你用 Navicat 连接
    volumes:
      - ./mysql_data:/var/lib/mysql # 数据持久化
    networks:
      - my_net

  # 2. Nginx 服务
  nginx:
    image: swr.cn-north-4.myhuaweicloud.com/library/nginx:latest
    container_name: my_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf # 挂载配置文件
      - ./code/webSource:/usr/share/nginx/web
    depends_on:
      app:
        condition: service_healthy # 等 app clone 并编译完成后再启动
    networks:
      - my_net

  # 3. 你的 C++ 开发环境
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: my_cpp_dev
    volumes:
      - ./code:/app/code  # clone 后的代码会出现在这里，修改即时生效
      - ${GIT_SSH_KEY_PATH}:/root/.ssh/id_ed25519  # SSH 私钥，用于 git clone（GIT_SSH_KEY_PATH 为空时不挂载）
    ports:
      - "8080:8080"     # 你的 C++ 程序端口
    environment:
      - GIT_REPO_URL=${GIT_REPO_URL}
      - ENABLE_INIT_DB=${ENABLE_INIT_DB:-true}
      - DB_HOST=${DB_HOST}        # 环境变量：告诉代码数据库在哪里,正式环境这里使用内网地址
      - DB_USER=${DB_USER}        # 账号: 正式环境数据库账号
      - DB_PASS=${DB_PASS}        # 账密码: 正式环境数据库密码
      - DB_NAME=${DB_NAME}        # 数据库: 正式环境数据库
    depends_on:
      - db                # 使用外部数据库时去掉此依赖
    networks:
      - my_net
    healthcheck:
      test: ["CMD-SHELL", "test -d /app/code/.git"] # clone 完成即视为健康
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 120s
    privileged: true # 给予一定权限，方便调试

networks:
  my_net:
    driver: bridge